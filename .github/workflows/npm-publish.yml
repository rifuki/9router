name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js standalone
        run: npm run build

      - name: Copy standalone to CLI
        run: |
          mkdir -p cli/app
          cp -r .next/standalone/* cli/app/
          cp -r public cli/app/
          cp -r .next/static cli/app/.next/
          cp -r src/mitm cli/app/src/ 2>/dev/null || true

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
