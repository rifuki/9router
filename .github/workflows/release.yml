name: Build & Release Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node20-linux-x64
            artifact: 9router-linux-x64
          - os: macos-latest
            target: node20-macos-x64
            artifact: 9router-darwin-x64
          - os: macos-latest
            target: node20-macos-arm64
            artifact: 9router-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install

      - name: Build Next.js standalone
        run: bun run build

      - name: Copy static assets
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Create package.json for standalone
        run: |
          cat > .next/standalone/package.json << 'EOF'
          {
            "name": "9router",
            "version": "1.0.0",
            "private": true,
            "bin": "server.js",
            "pkg": {
              "assets": [
                ".next/**/*",
                "public/**/*",
                "node_modules/**/*"
              ],
              "targets": ["${{ matrix.target }}"],
              "outputPath": "dist"
            }
          }
          EOF

      - name: Build binary with pkg
        run: |
          cd .next/standalone
          pkg . --targets ${{ matrix.target }} --output ../${{ matrix.artifact }}

      - name: Create tarball
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C .next ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
