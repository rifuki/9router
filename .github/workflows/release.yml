name: Build & Release Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact: 9router-linux-x64
          - os: macos-latest
            target: darwin-x64
            artifact: 9router-darwin-x64
          - os: macos-latest
            target: darwin-arm64
            artifact: 9router-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install

      - name: Build Next.js standalone
        run: bun run build

      - name: Copy static assets
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

      - name: Create SEA config
        run: |
          cat > sea-config.json << 'EOF'
          {
            "main": ".next/standalone/server.js",
            "output": "sea-prep.blob",
            "disableExperimentalSEAWarning": true
          }
          EOF

      - name: Generate SEA blob
        run: node --experimental-sea-config sea-config.json

      - name: Create binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp $(command -v node) ${{ matrix.artifact }}

          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign --remove-signature ${{ matrix.artifact }}
          fi

          npx postject ${{ matrix.artifact }} NODE_SEA_BLOB sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

          chmod +x ${{ matrix.artifact }}

      - name: Create tarball
        run: tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
